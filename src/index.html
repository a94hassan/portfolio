  <!-- Typography: Unbounded (expanded geometric display) + Inter (precision UI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;500;600;700&family=Inter:ital,opsz,wght@0,14..32,300;0,14..32,400;0,14..32,500;0,14..32,600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

  <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">

  <!-- Pre-bootstrap theme detection: prevents light/dark FOUC on the loader -->
  <script>
    (function() {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light') document.documentElement.classList.add('light');
      } catch (e) {}
    })();
  </script>

  <!-- Loader styles inlined to render BEFORE main CSS bundle arrives -->
  <style>
    #app-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #070608;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 28px;
      opacity: 1;
      visibility: visible;
      transition: opacity 800ms cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 800ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    html.light #app-loader { background: #f6f4f1; }
    #app-loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    .loader-wordmark {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      transform: translateY(-2px);
    }
    .loader-fn {
      font-family: 'Unbounded', sans-serif;
      font-style: normal;
      font-weight: 500;
      font-size: clamp(28px, 4vw, 52px);
      letter-spacing: -0.02em;
      line-height: 1;
      color: #ede9e3;
      background: linear-gradient(160deg, #ede9e3 15%, rgba(226,232,240,0.35) 70%, transparent 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    html.light .loader-fn {
      background: linear-gradient(160deg, #1c1a18 15%, rgba(28,26,24,0.38) 70%, transparent 100%);
      -webkit-background-clip: text; background-clip: text;
    }
    .loader-ln {
      font-family: 'Inter', sans-serif;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: rgba(226,232,240,0.35);
      line-height: 1;
      padding-left: 2px;
    }
    html.light .loader-ln { color: rgba(28,26,24,0.38); }
    .loader-line {
      width: 88px; height: 1px;
      background: rgba(226,232,240,0.09);
      overflow: hidden; position: relative;
    }
    html.light .loader-line { background: rgba(28,26,24,0.09); }
    .loader-line::after {
      content: '';
      position: absolute; inset: 0;
      background: rgba(226,232,240,0.55);
      animation: loaderFill 1.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      transform: scaleX(0);
      transform-origin: left center;
    }
    html.light .loader-line::after { background: rgba(28,26,24,0.55); }
    @keyframes loaderFill {
      0%   { transform: scaleX(0); transform-origin: left center; }
      45%  { transform: scaleX(1); transform-origin: left center; }
      55%  { transform: scaleX(1); transform-origin: right center; }
      100% { transform: scaleX(0); transform-origin: right center; }
    }
    @media (prefers-reduced-motion: reduce) {
      .loader-line::after {
        animation: none;
        transform: scaleX(0.4);
        opacity: 0.6;
      }
    }
  </style>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Person",
    "name": "Hassan Ammar",
    "url": "https://hassan-ammar.com",

      "https://github.com/a94hassan",
      "https://www.linkedin.com/in/hassan-ammar-/"
    ]
  }
  </script>
</head>
<body>
  <!-- Loader: shown until Angular bootstraps + first beat animates in.
       Removed by AppComponent.hideLoader() after fireEntrance(0) + fonts ready. -->
  <div id="app-loader" aria-label="Loading" role="status">
    <div class="loader-wordmark">
      <span class="loader-fn">Hassan</span>
      <span class="loader-ln">Ammar</span>
    </div>
    <div class="loader-line" aria-hidden="true"></div>
  </div>
  <app-root></app-root>
</body>
</html>
