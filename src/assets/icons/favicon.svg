<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <style>
    .bg { fill: none; }
    .stroke-main { stroke: #ede9e3; stroke-width: 1.5; fill: none; }
    .stroke-sub { stroke: #ede9e3; stroke-width: 0.8; fill: none; opacity: 0.5; }
    @media (prefers-color-scheme: light) {
      .stroke-main { stroke: #1c1a18; }
      .stroke-sub { stroke: #1c1a18; }
    }
  </style>
  <rect class="bg" width="32" height="32" />
  <!-- Double concentric astronomical circles -->
  <circle cx="16" cy="16" r="13" class="stroke-main" stroke-dasharray="40 8" />
  <circle cx="16" cy="16" r="7" class="stroke-main" />
  <!-- Elegant crosshairs -->
  <path d="M16 1v4M16 27v4M1 16h4M27 16h4" class="stroke-sub" stroke-linecap="round" />
</svg>
